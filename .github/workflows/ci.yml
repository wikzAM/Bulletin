name: ci

# Windows first (docs/SPEC.md, Platform section). Add a macOS job when the Mac build starts.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Tests create their own git repos; keep line endings as written.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # install (frozen lockfile), lint, typecheck, tests: the one check for the whole repo
      - run: pnpm run verify

  # Compile the Rust core once it exists (src-tauri/ arrives with the Tauri scaffold).
  cargo-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: rust
        shell: bash
        run: |
          if [ -f src-tauri/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.rust.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.rust.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.rust.outputs.present == 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
