name: release

# Builds the Windows installers (NSIS and MSI) with the Tauri bundler.
#
# UNSIGNED. Signing is a later step and needs a code-signing certificate that does not exist yet, so
# Windows SmartScreen will warn when someone runs the installer. When there is a certificate, add it as
# repository secrets and pass it to the Tauri build (see "Signing" in docs/PACKAGING.md). Never put
# certificate material or passwords in this file.
#
# Draft: copy to .github/workflows/release.yml once the gh token has the `workflow` scope.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # tauri-action attaches the installers to a draft GitHub release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the sidecar executable is a copy of this node; pinned on purpose
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # 1. The sidecar executable, src-tauri/binaries/bulletin-sidecar-x86_64-pc-windows-msvc.exe
      - run: pnpm run sidecar:prepare
      # The default test run skips building the 90 MB executable; the release proves it starts and answers health.
      - run: pnpm exec vitest run packages/packaging
        env:
          BULLETIN_SIDECAR_EXE_TEST: "1"

      # 2. The installers. tauri-action runs `tauri build`, whose beforeBuildCommand builds the desktop frontend.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing, later: TAURI_SIGNING_* / certificate secrets go here, from repository secrets.
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Bulletin ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi

      # 3. Keep the installers with the run, so a manual (workflow_dispatch) build can be downloaded without a release.
      - uses: actions/upload-artifact@v4
        with:
          name: bulletin-windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
