name: release

# Builds the Windows installers (MSI and NSIS) with the Tauri bundler.
# Unsigned for now: no signing certificate is configured, so Windows SmartScreen will warn.
# When one exists, add its details as repository secrets and pass them to tauri-action
# (see docs/PACKAGING.md); never put them in this file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # tauri-action attaches the installers to a draft GitHub release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - id: app
        shell: bash
        run: |
          if [ -f src-tauri/tauri.conf.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::src-tauri/tauri.conf.json not found; the desktop app is not scaffolded yet, nothing to build."; fi
      - if: steps.app.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.app.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.app.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.app.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # Tauri bundles this as an external binary: bulletin-sidecar-x86_64-pc-windows-msvc.exe
      - if: steps.app.outputs.present == 'true'
        run: node scripts/build-sidecar.mjs
      # The default test run skips building the 90 MB executable; the release proves it starts and answers health.
      - if: steps.app.outputs.present == 'true'
        run: pnpm exec vitest run packages/packaging
        env:
          BULLETIN_SIDECAR_EXE_TEST: "1"
      - if: steps.app.outputs.present == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Bulletin ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles msi,nsis
