[package]
name = "bulletin-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[features]
default = []
# Auto-update, OFF unless built with --features updater (see docs/PACKAGING.md, "Updates").
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-updater = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
